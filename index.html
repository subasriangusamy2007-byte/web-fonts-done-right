
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Web Fonts Done Right</title>

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      font-display: swap;
      margin: 0;
      padding: 30px;
      background-color: #f4f4f4;
      color: #333;
    }

    h1 {
      color: #5b4bdb;
      font-weight: 600;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Web Fonts Done Right</h1>

    <p>
      Google Fonts makes websites look beautiful
      and improves typography.
    </p>

    <p>
      The font-display: swap property displays
      fallback text while the custom font loads.
    </p>
  </div>
</body>
</html>
